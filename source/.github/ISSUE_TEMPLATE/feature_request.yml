name: Feature request
description: Suggest an improvement to Media Review.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the situation and who would benefit.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Explain how the app should behave.
    validations:
      required: true
